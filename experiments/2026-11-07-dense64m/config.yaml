# 实验：2026-11-07 dense 64M 全流程
# 目的：第一次跑通 pretrain → sft → eval，确认数据/显存/脚本链路
# 说明：这份是「实际执行时用的快照」，不是引用；跑之前先把 configs/ 复制过来再改

name: 2026-11-07-dense64m
host: local-windows            # local-windows | autodl-3090 | autodl-4090
minimind_commit: TO_FILL       # setup 脚本会打印，记在这里

paths:
  dataset_dir: dataset
  save_dir: out
  minimind_dir: third_party/minimind

model:
  hidden_size: 768
  num_hidden_layers: 8
  use_moe: 0

pretrain:
  data_file: pretrain_t2t_mini.jsonl
  batch_size: 8
  accumulation_steps: 16
  max_seq_len: 256
  num_workers: 2
  epochs: 1
  learning_rate: 5.0e-4
  dtype: bfloat16
  log_interval: 50
  save_interval: 500
  from_weight: none

sft:
  data_file: sft_t2t_mini.jsonl
  batch_size: 4
  accumulation_steps: 4
  max_seq_len: 512
  num_workers: 2
  epochs: 1
  learning_rate: 1.0e-5
  dtype: bfloat16
  log_interval: 50
  save_interval: 500
  from_weight: pretrain
