# 本地：Windows + RTX 5060 Ti 8GB
# 用 scripts/launch.py 读取，转换成 MiniMind 的训练参数

name: local_8gb
device: cuda

paths:
  dataset_dir: dataset            # 相对 llm-lab 根目录
  save_dir: out                   # 相对 llm-lab 根目录
  minimind_dir: third_party/minimind

model:
  hidden_size: 768                # dense 64M 的默认宽度
  num_hidden_layers: 8
  use_moe: 0                      # 0 = dense，1 = MoE

pretrain:
  data_file: pretrain_t2t_mini.jsonl
  batch_size: 8
  accumulation_steps: 16          # 有效 batch = 8 x 16 = 128
  max_seq_len: 256
  num_workers: 2
  epochs: 1
  learning_rate: 5.0e-4
  dtype: bfloat16
  log_interval: 50
  save_interval: 500
  from_weight: none

sft:
  data_file: sft_t2t_mini.jsonl
  batch_size: 4
  accumulation_steps: 4           # 有效 batch = 4 x 4 = 16
  max_seq_len: 512
  num_workers: 2
  epochs: 1
  learning_rate: 1.0e-5
  dtype: bfloat16
  log_interval: 50
  save_interval: 500
  from_weight: pretrain
